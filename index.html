<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>RAAL Grade 5 Mathematics Quiz Bee</title>
<style>
:root{--blue:#2563eb;--ink:#10233f;--muted:#64748b;--bg:#f4f8fc;--card:#fff;--good:#15803d;--bad:#b91c1c}
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:linear-gradient(135deg,#eef6ff,#f8fbff);color:var(--ink)}
.container{max-width:1050px;margin:auto;padding:18px}.card{background:var(--card);border:1px solid #dbe5f0;border-radius:24px;box-shadow:0 12px 30px #0f274011;padding:28px}
h1{margin:0 0 5px;font-size:32px}h2{margin:0 0 12px}.brand{font-weight:800;color:#0f2f5d;font-size:26px}.subtitle{color:#526b86;font-size:18px}
.hidden{display:none!important}.login{max-width:650px;margin:6vh auto}.login input{width:100%;padding:17px;border:2px solid #d8e2ef;border-radius:16px;font-size:18px;margin:18px 0}.btn{border:0;border-radius:14px;padding:13px 18px;font-weight:700;cursor:pointer;background:var(--blue);color:#fff}.btn.secondary{background:#e8eef7;color:var(--ink)}.btn.danger{background:#fee2e2;color:#991b1b}
.row{display:flex;gap:10px;flex-wrap:wrap}.controls{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:18px 0}.controls select,.controls input{padding:11px;border:1px solid #d8e2ef;border-radius:12px;background:white}
.stat{background:#f7faff;border:1px solid #dbe5f0;padding:12px;border-radius:14px}.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.timer{font-size:25px;font-weight:800;color:var(--blue)}.progress{height:9px;background:#e5edf7;border-radius:99px;overflow:hidden;margin:15px 0}.progress>div{height:100%;background:var(--blue)}
.question{font-size:23px;line-height:1.4;margin:20px 0}.option{display:block;width:100%;text-align:left;background:#fff;border:2px solid #dce6f2;padding:15px;margin:10px 0;border-radius:15px;font-size:17px;cursor:pointer}.option:hover{border-color:#8db2f7}.option.correct{border-color:#22c55e;background:#f0fdf4}.option.wrong{border-color:#ef4444;background:#fef2f2}.feedback{padding:16px;border-radius:15px;margin-top:15px;background:#f7faff;border:1px solid #dbe5f0}.solution{margin-top:10px;padding:14px;background:#f8fafc;border-left:4px solid var(--blue);border-radius:8px;white-space:pre-wrap}
.review-item{padding:16px;border:1px solid #dbe5f0;border-radius:16px;margin:12px 0}.small{color:var(--muted);font-size:14px}.score{font-size:42px;font-weight:800;color:var(--blue)}
@media(max-width:760px){.controls{grid-template-columns:1fr 1fr}.card{padding:20px;border-radius:20px}.question{font-size:20px}.brand{font-size:22px}}
@media(max-width:480px){.container{padding:10px}.controls{grid-template-columns:1fr}.btn{width:100%}}
</style>
</head>
<body>
<div id="login" class="container login">
<div class="card">
<div class="brand">RAAL Educational Resources</div>
<div class="subtitle">GRADE 5 MATHEMATICS QUIZ BEE</div>
<h1 style="margin-top:28px">Unlock the Game</h1>
<p>Enter your personal access code before playing.</p>
<input id="codeInput" placeholder="R5MATH-XXX-XXXX" autocomplete="off" autocapitalize="characters">
<button class="btn" style="width:100%" onclick="unlock()">Unlock Game</button>
<p id="loginMsg" class="small"></p>
</div></div>

<div id="app" class="container hidden">
<div class="topbar card" style="padding:18px">
<div><div class="brand">RAAL Educational Resources</div><div class="subtitle">Grade 5 Mathematics Quiz Bee</div></div>
<button class="btn secondary" onclick="lockGame()">Lock Game</button>
</div>
<div id="home" class="card" style="margin-top:16px">
<h2>Choose Your Challenge</h2>
<div class="controls">
<select id="mode"><option>Practice</option><option>Quiz Bee</option></select>
<select id="difficulty"><option>All Difficulties</option><option>Easy</option><option>Average</option><option>Difficult</option></select>
<select id="topic"><option>All Topics</option></select>
<select id="count"><option>10</option><option>20</option><option>30</option><option>50</option><option>100</option><option>All Available</option></select>
<select id="timer"><option value="0">No Timer</option><option value="15">15 sec</option><option value="20">20 sec</option><option value="30">30 sec</option><option value="45">45 sec</option></select>
</div>
<div class="row">
<div class="stat"><b>650</b><br><span class="small">Audited Questions</span></div>
<div class="stat"><b>3</b><br><span class="small">Difficulty Levels</span></div>
<div class="stat"><b>Marathon</b><br><span class="small">All available items</span></div>
</div>
<div class="row" style="margin-top:18px"><button class="btn" onclick="startGame()">Start Challenge</button><button class="btn secondary" onclick="startMarathon()">Marathon Mode</button></div>
</div>

<div id="game" class="card hidden" style="margin-top:16px">
<div class="topbar"><div><b id="roundLabel"></b><div class="small" id="qnum"></div></div><div class="timer" id="timerDisplay"></div></div>
<div class="progress"><div id="bar"></div></div>
<div class="question" id="question"></div>
<div id="options"></div>
<div id="feedback" class="feedback hidden"></div>
<div class="row" style="margin-top:15px"><button id="nextBtn" class="btn hidden" onclick="nextQuestion()">Next Question</button><button class="btn secondary" onclick="endGame()">End Challenge</button></div>
</div>

<div id="results" class="card hidden" style="margin-top:16px"></div>
</div>

<script src="data/questions.js"></script><script src="data/access.js"></script>
<script>
let bank=window.RAAL_G5MATH_QUESTIONS||[], codes=new Set(window.RAAL_G5MATH_CODES||[]);
let session=[],idx=0,score=0,answered=false,timer=null,timeLeft=0,mode="Practice";
const $=id=>document.getElementById(id);
function unlock(){let c=$("codeInput").value.trim().toUpperCase(); if(codes.has(c)){sessionStorage.setItem("raalG5Unlocked","1");$("login").classList.add("hidden");$("app").classList.remove("hidden");init();}else $("loginMsg").textContent="Invalid access code. Please check your personal code and try again."}
function lockGame(){sessionStorage.removeItem("raalG5Unlocked");location.reload()}
function init(){[...new Set(bank.map(x=>x.topic))].sort().forEach(t=>{let o=document.createElement("option");o.textContent=t;$("topic").appendChild(o)})}
function shuffle(a){return a.sort(()=>Math.random()-.5)}
function filtered(){let d=$("difficulty").value,t=$("topic").value;return bank.filter(x=>(d==="All Difficulties"||x.difficulty===d)&&(t==="All Topics"||x.topic===t))}
function startMarathon(){let f=filtered(); if(!f.length)return; mode="Practice"; session=shuffle([...f]); startPrepared()}
function startGame(){let f=filtered(); if(!f.length)return; mode=$("mode").value; let n=$("count").value==="All Available"?f.length:+$("count").value; session=shuffle([...f]).slice(0,n); startPrepared()}
function startPrepared(){idx=0;score=0;$("home").classList.add("hidden");$("results").classList.add("hidden");$("game").classList.remove("hidden");showQuestion()}
function showQuestion(){answered=false;clearInterval(timer);let x=session[idx];$("roundLabel").textContent=mode+" • "+x.difficulty+" Round";$("qnum").textContent=`Question ${idx+1} of ${session.length}`;$("bar").style.width=((idx)/session.length*100)+"%";$("question").textContent=x.question;$("feedback").classList.add("hidden");$("nextBtn").classList.add("hidden");$("options").innerHTML="";
[["A",x.choice_a],["B",x.choice_b],["C",x.choice_c],["D",x.choice_d]].forEach(([k,v])=>{let b=document.createElement("button");b.className="option";b.innerHTML="<b>"+k+".</b> "+escapeHtml(v);b.onclick=()=>answer(k,b);$("options").appendChild(b)});
let t=+$("timer").value;if(t){timeLeft=t;$("timerDisplay").textContent=t+"s";timer=setInterval(()=>{timeLeft--;$("timerDisplay").textContent=timeLeft+"s";if(timeLeft<=0){clearInterval(timer);if(!answered)answer(null,null,true)}},1000)}else $("timerDisplay").textContent=""}
function answer(k,btn,timeout=false){if(answered)return;answered=true;clearInterval(timer);let x=session[idx],correct=x.correct_answer;if(k===correct)score++;document.querySelectorAll(".option").forEach(b=>b.disabled=true);document.querySelectorAll(".option")[["A","B","C","D"].indexOf(correct)].classList.add("correct");if(btn&&k!==correct)btn.classList.add("wrong");$("feedback").innerHTML="<b>"+(k===correct?"Correct!":"Review this item.")+"</b><br>"+escapeHtml(x.rationale)+"<div class='solution'><b>Complete solution:</b><br>"+escapeHtml(x.solution)+"</div>";$("feedback").classList.remove("hidden");$("nextBtn").textContent=idx===session.length-1?"View Results":"Next Question";$("nextBtn").classList.remove("hidden")}
function nextQuestion(){if(idx<session.length-1){idx++;showQuestion()}else showResults()}
function endGame(){showResults()}
function showResults(){$("game").classList.add("hidden");$("results").classList.remove("hidden");let pct=Math.round(score/session.length*100);$("results").innerHTML=`<div class="score">${score}/${session.length}</div><h2>Challenge Complete</h2><p>You scored ${pct}%.</p><p class="small">Review your answers below. Each item includes its rationale and complete mathematical solution.</p><div class="row"><button class="btn" onclick="startPrepared()">Play Again</button><button class="btn secondary" onclick="goHome()">Back to Home</button></div><div id="review" style="margin-top:18px"></div>`;let r=$("review");session.forEach((x,i)=>{let d=document.createElement("div");d.className="review-item";d.innerHTML=`<b>${i+1}. ${escapeHtml(x.question)}</b><p class="small">Correct answer: ${escapeHtml(x.choice_x||x["choice_"+x.correct_answer.toLowerCase()])}</p><p>${escapeHtml(x.rationale)}</p><div class="solution">${escapeHtml(x.solution)}</div>`;r.appendChild(d)})}
function goHome(){$("results").classList.add("hidden");$("home").classList.remove("hidden")}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
if(sessionStorage.getItem("raalG5Unlocked")==="1"){ $("login").classList.add("hidden");$("app").classList.remove("hidden");init() }
</script>
</body></html>
